<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test 2 Vocabulary Quizzer</title><style>*{box-sizing:border-box}body{margin:0;background:#edf2f7;color:#183047;font:18px/1.55 system-ui,sans-serif}main{max-width:900px;margin:30px auto;padding:24px}article,.setup{background:white;border-radius:18px;padding:26px;margin:18px 0;box-shadow:0 4px 22px #18304712}h1{margin:0;font-size:32px}h2{font-size:24px}button,select{font:inherit;border-radius:9px;padding:12px;border:1px solid #aab9c6;background:white;color:inherit}button{cursor:pointer}button:hover{background:#e8f1fa}button:focus-visible,select:focus-visible{outline:3px solid #187cc0}button:disabled{cursor:default;opacity:.8}.primary{background:#185c8c;color:white}.options{display:grid;gap:12px}.options button{text-align:left;width:100%}.good{background:#d8f1e1!important;border-color:#297546}.bad{background:#fce0df!important;border-color:#b23a35}.small{font-size:15px;color:#4e6071}.warn{padding:12px;background:#fff2d4;border-radius:8px}#feedback{margin:20px 0}#status{font-weight:600}label{display:block;margin:12px 0}nav{display:flex;gap:10px;flex-wrap:wrap}progress{width:100%;height:12px}summary{cursor:pointer}li{margin:15px 0}@media(max-width:600px){main{margin:0;padding:14px}article,.setup{padding:18px}}</style><main><h1>Test 2 Vocabulary Quizzer</h1><p>Practice the fill-in-the-blank answers as multiple-choice questions. Choose one answer for each question.</p><section class="setup"><label for="source">Study group</label><select id="source"><option value="all">All quizzes and review questions</option></select><label><input id="flagged" type="checkbox" checked> Include source items that need verification</label><nav><button id="start" class="primary">Start / Restart</button><button id="missed" disabled>Practice missed questions</button></nav><p class="small">35 source questions. Questions with several blanks use one combined answer choice. Question and answer order shuffle each round. No internet needed.</p></section><p id="status" aria-live="polite"></p><progress id="progress" value="0" max="35"></progress><article id="card"></article></main><script>
const bank=[];
function add(source,n,q,a,wrong,note=''){bank.push({id:source+'-'+n,source,n,q,a,choices:[a,...wrong],note});}
const q4='Quiz 4',q5='Quiz 5',q6='Quiz 6',r4='Review Section 4',r5='Review Sections 5 and 6',r7='Review Section 7';
add(q4,17,'Placing heat strips in series with an outdoor thermostat so they energize only at a specific outdoor temperature is called _____.','staging',['sequencing the refrigerant','short cycling','equalizing']);
add(q5,3,'Which component supplies the thermostat with power by reducing line voltage to 24 volts?','transformer',['contactor','sequencer','reversing valve']);
for(const [n,room,term,a] of [[5,65,'B','0'],[17,65,'W','0'],[20,70,'B','0'],[22,69,'W','24']])add(q6,n,`According to the Quiz 6 accepted-answer key, with a 70°F set point and a ${room}°F room temperature, what R-to-${term} voltage was listed for this question?`,a+' volts',[a==='0'?'24 volts':'0 volts'],'Source-key recall only: selected system and fan settings were not preserved in the text extraction, so this is not a complete voltage troubleshooting scenario.'+(n===22?' The submitted 0 was not the accepted answer; the key lists 24.':''));
add(r5,1,'COP is the abbreviation for _____.','coefficient of performance',['capacity of pressure','control operating power','coefficient of pressure']);
add(r5,2,'The source gives which two outdoor temperatures for an air-to-air heat pump COP rating?','47°F and 17°F',['65°F and 35°F','50°F and 30°F','95°F and 75°F']);
add(r5,3,'As outdoor temperature decreases, the COP _____.','decreases',['increases','stays constant','becomes zero immediately']);
add(r5,4,'The lowest outdoor temperature at which a heat pump can satisfactorily heat the structure is the _____.','balance point',['dew point','flash point','cut-in differential']);
add(r5,5,'In a dual fuel system, the heat pump should cycle _____ before the gas or oil heater cycles _____.','off; on',['on; off','off; off','on; on']);
add(r5,6,'The outdoor thermostat should close its contacts how many degrees above the calculated balance point, according to the review?','3 degrees',['1 degree','5 degrees','10 degrees']);
add(r5,7,'During defrost, most residential air source heat pumps turn on which heating assistance?','heat strips',['oil burner only','crankcase heater only','outdoor fan motor']);
add(r5,8,'According to the review, at what outdoor temperature should heating or cooling not be needed?','65°F',['17°F','32°F','47°F']);
add(r5,9,'Which exact formula wording is listed as the accepted answer in Sections 5 and 6, Question 9?','BTU/watts=Kw',['BTU × watts=Kw','watts/BTU=Kw','BTU + watts=Kw'],'Source wording only: the accepted formula is unclear about units and time. Verify it with your instructor before using it for calculations.');
add(r5,11,'What are three common types of secondary heat?','electric; oil; gas',['solar; geothermal; wind','electric; steam; refrigerant','oil; water; air']);
add(r5,12,'Auxiliary heat should be approximately what percentage of the structural load at design conditions, according to the review?','80%',['50%','65%','100%']);
add(r5,14,'How should electric secondary heaters come on?','staged',['all at once in every situation','only with the compressor off','without thermostat control']);
add(r5,15,'In which three functions do secondary heaters operate?','auxiliary; emergency; defrost',['cooling; ventilation; dehumidification','auxiliary; cooling; ventilation','emergency; cooling; pressure equalization']);
add(r7,1,'The main control for a heat pump system is the _____.','indoor thermostat',['outdoor fan','compressor contactor','filter dryer']);
add(r7,2,'The minimum control wire size for the indoor thermostat in the review is _____ gauge.','18',['10','14','22']);
add(r7,3,'What rating does the review list for most residential heat pump control transformers?','40–50 VA',['10–20 VA','100–150 VA','240–480 VA']);
add(r7,4,'In emergency heat mode, the fan speed will usually _____.','be slower',['be faster','remain at maximum cooling speed','reverse direction']);
add(r7,5,'Thermostat control wiring is normally connected to the thermostat’s _____.','subbase',['temperature sensor','display screen','mercury bulb']);
add(r7,6,'A diagram showing components between the source lines is called a _____.','ladder diagram',['pictorial diagram','floor plan','refrigerant pressure chart']);
add(r7,8,'What is a sequencer, and what does it do on a heat pump?','time delay; bring on strips in stages',['pressure switch; reverse refrigerant flow','transformer; raise control voltage','temperature sensor; measure superheat']);
add(r7,9,'Approximately how many heat strips are energized by one set of sequencer contacts, according to the review?','1 (one)',['2','3','4']);
add(r7,10,'Which two safeties prevent electric heater overheating, and which must be replaced after it functions?','Thermal cutout; fused-link; fused-link',['Thermal cutout; fused-link; thermal cutout','High-pressure switch; low-pressure switch; high-pressure switch','Sequencer; contactor; sequencer']);
const unverified='The Section 4 document shows a filled-in response without an accepted-answer key. This choice reproduces that response; verify it with your instructor.';
add(r4,1,'Which closing and opening temperatures are written in the Section 4 response (close first, open second)?','50°F; 30°F',['30°F; 50°F','65°F; 17°F','47°F; 65°F'],unverified+' The close/open order especially needs verification.');
add(r4,3,'Which defrost control does the Section 4 response name for small window units and PTACs?','Temperature Differential Thermostat',['Outdoor staging thermostat','High-pressure cutout','Compressor contactor'],unverified);
add(r4,4,'Which method does the Section 4 response identify as demand defrost?','Time, Temperature, and Pressure',['Time only','Indoor temperature only','Compressor amperage only'],unverified);
add(r4,5,'Which two actions does the Section 4 response give for making a solid state defrost board enter defrost?','close defrost thermostat; jumper the test pins',['open defrost thermostat; disconnect the transformer','open the contactor; remove the fan','raise the room set point; open the pressure switch'],unverified+' This is a study item, not equipment-specific service instructions.');
add(r4,6,'Which two inputs does the Section 4 response name for initiating residential air source heat pump defrost?','Time; Temperature',['Voltage; Amperage','Humidity; Indoor airflow','Pressure; Fan speed'],unverified);
add(r4,7,'What does the Section 4 response say is used to defrost the outdoor coil?','Hot gas from the compressor',['Cold liquid from the metering device','Outdoor air alone','Condensate from the indoor coil'],unverified);
add(r4,8,'In the temperature and pressure defrost method, what ends defrost according to the Section 4 response?','Defrost thermostat',['Indoor fan relay','Room thermostat subbase','Compressor overload'],unverified);
const $=id=>document.getElementById(id),shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let round=[],index=0,answers=new Map(),missed=[];
for(const s of [...new Set(bank.map(q=>q.source))]){let o=document.createElement('option');o.value=s;o.textContent=s;$('source').append(o)}
function start(items){round=shuffle(items);index=0;answers=new Map();missed=[];$('missed').disabled=true;render()}
function render(){const total=round.length;$('progress').max=total||1;$('progress').value=answers.size;let score=[...answers.values()].filter(x=>x.correct).length;$('status').textContent=`Answered ${answers.size} of ${total} · Correct ${score}`;const card=$('card');card.replaceChildren();if(index>=total){let h=document.createElement('h2');h.textContent=total?`Round complete: ${score} / ${total} (${Math.round(score/total*100)}%)`:'No questions in this selection.';card.append(h);missed=round.filter(q=>!answers.get(q.id)?.correct);$('missed').disabled=!missed.length;for(const q of round){let p=document.createElement('p');p.textContent=`${answers.get(q.id).correct?'✓':'✗'} ${q.source} Q${q.n}: ${q.a}`;card.append(p)}return}
const q=round[index];let ref=document.createElement('p');ref.className='small';ref.textContent=`Question ${index+1} of ${total} · ${q.source} · Original question ${q.n}`;let heading=document.createElement('h2');heading.textContent=q.q;card.append(ref,heading);if(q.note){let warn=document.createElement('p');warn.className='warn small';warn.textContent=q.note;card.append(warn)}let opts=document.createElement('div');opts.className='options';let feedback=document.createElement('div');feedback.id='feedback';feedback.setAttribute('aria-live','polite');let next=document.createElement('button');next.className='primary';next.textContent=index===total-1?'See results':'Next question';next.disabled=true;next.onclick=()=>{index++;render()};for(const choice of shuffle(q.choices)){let b=document.createElement('button');b.textContent=choice;b.onclick=()=>{let correct=choice===q.a;answers.set(q.id,{correct,choice});for(const btn of opts.children){btn.disabled=true;if(btn.textContent===q.a)btn.classList.add('good')}if(!correct)b.classList.add('bad');feedback.textContent=correct?'Correct! '+q.a:'Correct answer: '+q.a;next.disabled=false;$('progress').value=answers.size;$('status').textContent=`Answered ${answers.size} of ${total} · Correct ${[...answers.values()].filter(x=>x.correct).length}`;next.focus()};opts.append(b)}card.append(opts,feedback,next)}
$('start').onclick=()=>start(bank.filter(q=>($('source').value==='all'||q.source===$('source').value)&&($('flagged').checked||!q.note)));
$('missed').onclick=()=>start(missed);
$('start').click();
</script></html>
