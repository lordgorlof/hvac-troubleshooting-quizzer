<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HVAC Troubleshooting Quizzer</title><style>body{font:17px system-ui,Arial;background:#eef3f8;color:#182d42;margin:0}main{max-width:750px;margin:25px auto;padding:12px}header,section{background:white;border:1px solid #d8e3ee;border-radius:15px;padding:22px;margin-bottom:15px}h1{margin:0;font-size:1.65rem}h2{font-size:1.3rem}p{line-height:1.5}.muted,small{color:#546779}.top,.actions{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.pill{background:#e4f1fc;color:#18496d;border-radius:25px;padding:5px 12px}button,select{font:inherit;padding:11px;border-radius:9px}button{background:#176bb0;color:white;border:0;cursor:pointer}button:disabled{opacity:.45}select{border:1px solid #9baebe;background:white}.choice{display:block;padding:12px;margin:9px 0;border:1px solid #c6d5e3;border-radius:10px;cursor:pointer}.choice:has(input:checked){background:#e5f1fd;border-color:#176bb0}.measure{display:grid;grid-template-columns:1fr 1fr;gap:8px}.measure div,.feedback{background:#edf4fa;border-radius:9px;padding:12px}.measure small{display:block}.feedback{margin:16px 0}.correct{color:#167047}.wrong{color:#b12d39}#track{height:8px;background:#e4eaf1;border-radius:9px;margin:14px 0}#bar{height:100%;background:#2580c5;border-radius:9px;width:0}.hidden{display:none}footer{font-size:13px;color:#526477;text-align:center}@media(max-width:480px){header,section{padding:15px}h1{font-size:1.4rem}}</style></head><body><main><header><p style="margin:0 0 14px"><a href="./troubleshooting-table.html" style="display:inline-block;background:#176bb0;color:white;text-decoration:none;padding:10px 14px;border-radius:9px">📋 Open Master Troubleshooting Table</a></p><h1>HVAC Troubleshooting Quizzer</h1><p class="muted">36 randomized questions • Symptoms and causes • iPad-friendly</p><div class="top"><label>System <select id="cat"><option value="All">All (36)</option><option value="Fixed">Fixed orifice (20)</option><option value="TXV">TXV (8)</option><option value="Heat pump">Heat pump (8)</option></select></label><button id="reset">New quiz</button></div></header><section><div class="top"><strong id="count"></strong><span id="score"></span></div><div id="track"><div id="bar"></div></div><div id="area"></div></section><footer>Based on your AC & Heat Pump Troubleshooting Guide. Diagnostic patterns are study expectations; verify actual faults with field tests and manufacturer data.</footer></main><script>
const faults=[["Low evaporator heat load","Fixed","Low","Low","Low","Low","Low","Dirty filter, blower, or coil; low airflow",1],["High evaporator heat load","Fixed","High","High","High","Normal","High","Hot return-air infiltration or high occupancy",2],["Undercharge","Fixed","Low","Low","High","Low","Low","Refrigerant leak or insufficient charge",3],["Overcharge","Fixed","High","High","Low","High","High","Excess refrigerant added",4],["Suction-line restriction","Fixed","Low","Low","High","Normal","Low","Kinked suction tubing or restricted suction drier",7],["Liquid-line restriction","Fixed","Low","Low","High","High","Low","Restricted liquid drier or kinked liquid line",8],["Restricted metering device","Fixed","Low","Low","High","High","Low","Debris, ice, or undersized piston",9],["Overfeeding metering device","Fixed","High","Low","Low","Low","High","Oversized piston or poor TXV bulb contact",10],["Inefficient compressor","Fixed","High","Low","High","High","Low","Damaged valves or internal leakage",11],["Low outdoor ambient","Fixed","Low","Low","High","High","Low","Outdoor temperature too low for cooling",13],["Undercharge","TXV","Normal / Low","Low","Normal / High","Low","Low","Refrigerant leak; TXV compensates initially",3],["Overcharge","TXV","Normal","High","Normal","High","High","Excess refrigerant in condenser",4],["Dirty condenser","TXV","Normal","High","Normal","Normal","High","Dirt blocking outdoor coil airflow",12],["Low outdoor ambient","TXV","Normal","Low","Normal","Normal","Low","Low outdoor temperature lowers head pressure",13],["Reversing valve bypass","Heat pump","High","Low","High","Low","Low","Stuck reversing-valve slider",14],["Outdoor check valve restricted (cool)","Heat pump","Low","Low","High","Low","Low","Stuck outdoor check valve in cooling",15],["Outdoor check valve stuck open (heat)","Heat pump","High","Low","Low","Low","High","Outdoor check valve bypassing metering device",16],["Indoor check valve stuck closed (heat)","Heat pump","Low","Low","High","High","Low","Indoor check valve restricting liquid flow",17]];
const fields=["Suction pressure","Head pressure","Superheat","Subcooling","Compressor amps"];
const bank=faults.flatMap((f,i)=>[{id:i*2,fault:i,type:"symptom",field:i%5},{id:i*2+1,fault:i,type:"cause"}]);
let order=[],pos=0,answer="",checked=false,results=[];
const el=id=>document.getElementById(id);
function mix(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(ids){order=mix(ids||bank.filter(q=>el("cat").value==="All"||faults[q.fault][1]===el("cat").value).map(q=>q.id));pos=0;answer="";checked=false;results=[];render()}
function render(){const total=order.length,correctCount=results.filter(r=>r.correct).length;el("count").textContent=pos>=total?"Finished":"Question "+(pos+1)+" of "+total;el("score").textContent=correctCount+" / "+results.length+" correct";el("bar").style.width=(results.length/total*100)+"%";
if(pos>=total){const wrong=results.filter(r=>!r.correct).map(r=>r.id);el("area").innerHTML="<h2>Final grade: "+Math.round(correctCount/total*100)+"%</h2><p>"+correctCount+" correct out of "+total+".</p>"+(wrong.length?'<button id="retry">Review '+wrong.length+' missed questions</button> ':"")+'<button id="again">New randomized quiz</button>';if(wrong.length)el("retry").onclick=()=>start(wrong);el("again").onclick=()=>start();return}
const q=bank.find(q=>q.id===order[pos]),f=faults[q.fault];let choices,heading,detail,correct;
if(q.type==="symptom"){heading=f[0];detail="What happens to <b>"+fields[q.field].toLowerCase()+"</b> compared with normal operation?";correct=f[q.field+2];choices=["Low","Normal","High","Normal / Low","Normal / High"].map(x=>({value:x,label:x}));}
else{heading="Identify the cause";detail="<p><b>Diagnosed fault:</b> "+f[0]+"</p><p>Which underlying cause best explains this condition?</p>";correct=String(q.fault);const wrong=mix(faults.map((x,i)=>i).filter(i=>i!==q.fault)).slice(0,3);choices=mix([q.fault,...wrong]).map(i=>({value:String(i),label:faults[i][7]}));}
el("area").innerHTML='<p><span class="pill">'+f[1]+' • '+(q.type==="symptom"?"Symptoms":"Causes")+'</span></p><h2>'+heading+'</h2><p>'+detail+'</p>'+choices.map(c=>'<label class="choice"><input type="radio" name="ans" value="'+c.value+'" '+(checked?"disabled":"")+' '+(answer===c.value?"checked":"")+'> '+c.label+'</label>').join("")+'<div id="feedback"></div><div class="actions"><button id="check" '+(!answer||checked?"disabled":"")+'>Check answer</button><button id="next" class="hidden">'+(pos===total-1?"See results":"Next question →")+'</button></div>';
el("area").querySelectorAll('input').forEach(input=>input.onchange=()=>{answer=input.value;el("check").disabled=false});
el("check").onclick=()=>{checked=true;const ok=answer===correct;results.push({id:q.id,correct:ok});el("area").querySelectorAll("input").forEach(x=>x.disabled=true);el("feedback").innerHTML='<div class="feedback"><strong class="'+(ok?"correct":"wrong")+'">'+(ok?"Correct!":"Incorrect")+'</strong><p><b>Correct answer:</b> '+(q.type==="symptom"?correct:f[7])+'</p><p><b>Explanation:</b> '+f[7]+'</p><small>Reference: Troubleshooting Guide page '+f[8]+'.</small></div>';el("check").disabled=true;el("next").classList.remove("hidden");el("score").textContent=results.filter(r=>r.correct).length+" / "+results.length+" correct";el("bar").style.width=(results.length/total*100)+"%"};
el("next").onclick=()=>{pos++;answer="";checked=false;render()};}
el("cat").onchange=()=>start();el("reset").onclick=()=>{if(results.length&&!confirm("Restart and reset score?"))return;start()};start();
</script></body></html>
