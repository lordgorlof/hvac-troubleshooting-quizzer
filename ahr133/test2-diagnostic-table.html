<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AHR 133 Diagnostic Table Quizzer</title><style>body{margin:0;background:#edf3f8;color:#18364e;font:17px/1.45 system-ui}main{max-width:820px;margin:auto;padding:18px}header,section{background:white;border-radius:14px;padding:20px;margin-bottom:14px}header{background:#143e5c;color:white}h1,h2,h3{margin:0 0 8px}header p{margin:0}button,select,textarea{font:inherit;padding:8px;border:1px solid #8198aa;border-radius:7px}button{background:#155e8d;color:white;cursor:pointer}button:disabled{opacity:.55;cursor:default}label{display:block}select{max-width:100%}.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));margin:14px 0}.grid select{display:block;width:100%}textarea{display:block;width:100%;box-sizing:border-box;margin:5px 0 10px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.good{color:#18603b}.wrong{color:#a72926}.muted{color:#496279}#feedback{padding:14px;background:#eef5fb;border-radius:8px;margin-top:12px}#validation{color:#a72926}[hidden]{display:none!important}</style></head><body><main><header><h1>AHR 133 Diagnostic Table Quizzer</h1><p>29 faults across Fixed Orifice, TXV Metering, and Heat Pump</p></header><section><label for="system">System</label><select id="system"><option value="all">All systems</option><option value="fixed">Fixed Orifice (13)</option><option value="txv">TXV Metering (12)</option><option value="hp">Heat Pump (4)</option></select> <button id="start">Start practice</button></section><section><label for="fault">Fault or operating condition</label><select id="fault"></select><p id="progress" class="muted" aria-live="polite"></p><p id="group" class="muted"></p><h2 id="title"></h2><p>Choose the five readings relative to normal operation.</p><div class="grid" id="readings"></div><label for="cause">Possible causes (optional, self-review)</label><textarea id="cause" rows="2" placeholder="List the causes you can recall"></textarea><p id="validation" role="status"></p><button id="check">Check readings and show causes</button><div id="feedback" hidden aria-live="polite"><h3 id="result"></h3><strong>Possible causes</strong><ul id="causes"></ul><p id="hint"></p><small id="source"></small></div><div class="bar"><button id="previous">Previous</button><button id="next">Next</button><button id="retry">Retry missed faults</button></div></section></main><script>const BANK=[{"id":"fixed0","group":"fixed","name":"Low Evaporator Heat Load","raw":["↓","↓","↓","↓","↓"],"causes":["Dirty air filter or evaporator coil","Dirty blower wheel or incorrect low blower speed","Undersized or restricted ductwork"],"hint":"Verify airflow and return/supply temperatures"},{"id":"fixed1","group":"fixed","name":"High Evaporator Heat Load","raw":["↑","↑","↑","Normal","↑"],"causes":["Excessive indoor heat load or hot return-air infiltration","Newly started system in a very hot space"],"hint":"Verify return-air conditions and duct leakage"},{"id":"fixed2","group":"fixed","name":"Low System Charge (Undercharge)","raw":["↓","↓","↑","↓","↓"],"causes":["Refrigerant leak","Insufficient charge after service or installation"],"hint":"Leak-test and verify charge using manufacturer procedure"},{"id":"fixed3","group":"fixed","name":"High System Charge (Overcharge)","raw":["↑","↑","↓","↑","↑"],"causes":["Too much refrigerant added during service","Incorrect charging procedure or conditions"],"hint":"Check charging history and manufacturer targets"},{"id":"fixed4","group":"fixed","name":"Non-Condensable Gasses","raw":["↑","↑","↓","Normal4","↑"],"causes":["Air or other noncondensable gas left after improper evacuation","Contamination during servicing"],"hint":"Review evacuation and service history; high head alone does not prove noncondensables"},{"id":"fixed5","group":"fixed","name":"Suction Line Restriction","raw":["↓","↓","↑","Normal","↓"],"causes":["Kinked or undersized suction line","Restricted suction-line filter drier"],"hint":"Check abnormal pressure/temperature drop"},{"id":"fixed6","group":"fixed","name":"Liquid Line Restriction","raw":["↓","↓","↑","↑","↓"],"causes":["Plugged liquid-line filter drier","Kinked or undersized liquid line"],"hint":"Check temperature drop across suspected restriction"},{"id":"fixed7","group":"fixed","name":"Restricted Metering Device","raw":["↓","↓","↑","↑","↓"],"causes":["Debris or ice at metering device","Undersized piston or TXV problem"],"hint":"Inspect device and compare feeding symptoms"},{"id":"fixed8","group":"fixed","name":"Overfeeding Metering Device","raw":["↑","↓","↓","↓","↑"],"causes":["Oversized or improperly seated piston","Loose or uninsulated TXV sensing bulb"],"hint":"Check piston sizing or TXV bulb mounting"},{"id":"fixed9","group":"fixed","name":"Inefficient Compressor","raw":["↑","↓","↑","↑","↓"],"causes":["Damaged compressor valves or internal leakage","Wear or damage from liquid slugging"],"hint":"Check pressure differential and rule out bypass"},{"id":"fixed10","group":"fixed","name":"Dirty Condenser","raw":["↑","↑","↓","↓/","↑"],"causes":["Dirt or debris obstructing outdoor coil","Insufficient condenser airflow or fan problem"],"hint":"Inspect coil and fan operation"},{"id":"fixed11","group":"fixed","name":"Low Outside Ambient Temperature","raw":["↓","↓","↑","↑","↓"],"causes":["Cooling operation in cold outdoor conditions","Missing or ineffective head-pressure control"],"hint":"Verify outdoor ambient and design controls"},{"id":"fixed12","group":"fixed","name":"Reversing Valve bypassing hot gas","raw":["↑","↓","↑","↓","↓"],"causes":["Reversing-valve slider not fully seated","Internal leakage from hot-gas side to suction side"],"hint":"Compare line temperatures and pressure differential"},{"id":"txv0","group":"txv","name":"Low Evaporator Heat Load","raw":["↓","↓","Normal1","Normal","↓"],"causes":["Dirty air filter or evaporator coil","Dirty blower wheel or incorrect low blower speed","Undersized or restricted ductwork"],"hint":"Verify airflow and return/supply temperatures"},{"id":"txv1","group":"txv","name":"High Evaporator Heat Load","raw":["↑","↑","Normal2","Normal","↑"],"causes":["Excessive indoor heat load or hot return-air infiltration","Newly started system in a very hot space"],"hint":"Verify return-air conditions and duct leakage"},{"id":"txv2","group":"txv","name":"Low System Charge (Undercharge)","raw":["Normal3/↓","↓","Normal3/↑","↓","↓"],"causes":["Refrigerant leak","Insufficient charge after service or installation"],"hint":"Leak-test and verify charge using manufacturer procedure"},{"id":"txv3","group":"txv","name":"High System Charge (Overcharge)","raw":["Normal","↑","Normal","↑","↑"],"causes":["Too much refrigerant added during service","Incorrect charging procedure or conditions"],"hint":"Check charging history and manufacturer targets"},{"id":"txv4","group":"txv","name":"Non-Condensable Gasses","raw":["Normal","↑","Normal1","Normal4","↑"],"causes":["Air or other noncondensable gas left after improper evacuation","Contamination during servicing"],"hint":"Review evacuation and service history; high head alone does not prove noncondensables"},{"id":"txv5","group":"txv","name":"Suction Line Restriction","raw":["Normal","↓","↑","Normal","↓"],"causes":["Kinked or undersized suction line","Restricted suction-line filter drier"],"hint":"Check abnormal pressure/temperature drop"},{"id":"txv6","group":"txv","name":"Liquid Line Restriction","raw":["↓","↓","↑","↑","↓"],"causes":["Plugged liquid-line filter drier","Kinked or undersized liquid line"],"hint":"Check temperature drop across suspected restriction"},{"id":"txv7","group":"txv","name":"Restricted Metering Device","raw":["↓","↓","↑","↑","↓"],"causes":["Debris or ice at metering device","Undersized piston or TXV problem"],"hint":"Inspect device and compare feeding symptoms"},{"id":"txv8","group":"txv","name":"Overfeeding Metering Device","raw":["↑","↓","↓","↓","↑"],"causes":["Oversized or improperly seated piston","Loose or uninsulated TXV sensing bulb"],"hint":"Check piston sizing or TXV bulb mounting"},{"id":"txv9","group":"txv","name":"Inefficient Compressor","raw":["↑","↓","↑","↑","↓"],"causes":["Damaged compressor valves or internal leakage","Wear or damage from liquid slugging"],"hint":"Check pressure differential and rule out bypass"},{"id":"txv10","group":"txv","name":"Dirty Condenser","raw":["Normal","↑","Normal","Normal","↑"],"causes":["Dirt or debris obstructing outdoor coil","Insufficient condenser airflow or fan problem"],"hint":"Inspect coil and fan operation"},{"id":"txv11","group":"txv","name":"Low Outside Ambient Temperature","raw":["Normal1","↓","Normal1","Normal","↓"],"causes":["Cooling operation in cold outdoor conditions","Missing or ineffective head-pressure control"],"hint":"Verify outdoor ambient and design controls"},{"id":"hp0","group":"hp","name":"Reversing valve bypassing hot gas","raw":["↑","↓","↑","↓","↓"],"causes":["Reversing-valve slider not fully seated","Internal leakage from hot-gas side to suction side"],"hint":"Compare line temperatures and pressure differential"},{"id":"hp1","group":"hp","name":"Outdoor check valve restriction (Cool)","raw":["↓","↓","↑","↓","↓"],"causes":["Outdoor check valve stuck or partially blocked in cooling","Debris obstructing valve"],"hint":"Check temperature drop across valve and refrigerant path"},{"id":"hp2","group":"hp","name":"Outdoor check valve stuck open (Heat)","raw":["↑","↓","↓","↓","↑"],"causes":["Outdoor check valve not seating in heating","Debris or mechanical failure"],"hint":"Check for bypass around metering device"},{"id":"hp3","group":"hp","name":"Indoor check valve stuck closed (Heat)","raw":["↓","↓","↑","↑","↓"],"causes":["Indoor check valve not opening in heating","Debris or mechanical failure"],"hint":"Check for temperature drop and liquid-line restriction"}];
(function(){
const $=id=>document.getElementById(id);
const labels=['Suction pressure','Head pressure','Superheat','Subcooling','Compressor amps'];
const systems={fixed:'Fixed Orifice',txv:'TXV Metering',hp:'Heat Pump'};
const describe=v=>v.replace(/Normal[1-5]/g,'Normal').replace('↑','High').replace('↓','Low').replace(/\/$/,'').replaceAll('/',' / ');
let pool=[],current=0,answers=new Map();
function option(value,label){const o=document.createElement('option');o.value=value;o.textContent=label;return o;}
function populate(items){
  pool=items;current=0;answers=new Map();
  $('fault').replaceChildren(...pool.map((q,i)=>option(i,systems[q.group]+' · '+q.name)));
  render();
}
function render(){
  const q=pool[current], result=answers.get(q.id);
  $('validation').textContent='';
  $('fault').value=current;
  $('title').textContent=q.name;
  $('group').textContent=systems[q.group];
  const scored=[...answers.values()].reduce((n,a)=>n+a.score,0);
  $('progress').textContent='Fault '+(current+1)+' of '+pool.length+' · '+answers.size+' checked · '+scored+' of '+(answers.size*5)+' readings correct';
  $('readings').replaceChildren();
  labels.forEach((label,i)=>{
    const wrap=document.createElement('label'),name=document.createElement('span'),select=document.createElement('select');
    name.textContent=label;select.id='reading-'+i;
    ['','High','Low','Normal','Normal / Low','Normal / High'].forEach(v=>select.append(option(v,v||'Select a reading')));
    wrap.append(name,select);
    if(result){
      select.value=result.values[i];select.disabled=true;
      const key=document.createElement('span'),right=result.values[i]===describe(q.raw[i]);
      key.className=right?'good':'wrong';key.textContent=(right?'✓ ':'✗ ')+describe(q.raw[i]);wrap.append(key);
    }
    $('readings').append(wrap);
  });
  $('cause').value=result?.cause||'';$('cause').disabled=!!result;
  $('feedback').hidden=!result;$('check').hidden=!!result;
  $('previous').disabled=current===0;$('next').disabled=current===pool.length-1;
  $('retry').disabled=![...answers.values()].some(a=>a.score<5);
  if(result){
    $('result').textContent=result.score+' of 5 readings correct';
    $('causes').replaceChildren();
    q.causes.forEach(c=>{const li=document.createElement('li');li.textContent=c;$('causes').append(li);});
    $('hint').textContent=q.hint;
    $('source').textContent='Table notation (in reading order): '+q.raw.join(' · ');
  }
}
$('start').onclick=()=>populate(BANK.filter(q=>$('system').value==='all'||q.group===$('system').value));
$('fault').onchange=()=>{current=Number($('fault').value);render();};
$('previous').onclick=()=>{if(current>0){current--;render();}};
$('next').onclick=()=>{if(current+1<pool.length){current++;render();}};
$('check').onclick=()=>{
  const values=labels.map((_,i)=>$('reading-'+i).value);
  if(values.includes('')){$('validation').textContent='Choose a reading for all five measurements.';return;}
  const q=pool[current],score=values.filter((v,i)=>v===describe(q.raw[i])).length;
  answers.set(q.id,{values,score,cause:$('cause').value});
  render();
};
$('retry').onclick=()=>populate(pool.filter(q=>answers.has(q.id)&&answers.get(q.id).score<5));
$('start').onclick();
})();</script></body></html>
